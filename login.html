<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · L'Amore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-root="./">
  <div id="site-header"></div>

  <main class="auth">
    <div class="auth__visual">
      <blockquote>«El amor no se mira, se siente.»</blockquote>
    </div>

    <div class="auth__panel">
      <div class="auth__box">
        <h1>Hola de nuevo</h1>
        <p>Inicia sesión para seguir planificando vuestra boda.</p>

        <form class="form" id="login-form" novalidate>
          <div class="form__message" role="status"></div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="tu@correo.com" required>
            <span class="field__error"></span>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            <span class="field__error"></span>
          </div>

          <div class="form__inline">
            <label class="check"><input type="checkbox" name="remember"> Recordarme</label>
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button class="btn btn--block" type="submit">Iniciar sesión</button>
        </form>

        <p class="auth__alt">¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
