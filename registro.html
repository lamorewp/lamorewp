<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · L'Amore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-root="./">
  <div id="site-header"></div>

  <main class="auth">
    <div class="auth__visual auth__visual--register">
      <blockquote>«Empieza hoy la historia que contaréis siempre.»</blockquote>
    </div>

    <div class="auth__panel">
      <div class="auth__box">
        <h1>Crea vuestra cuenta</h1>
        <p>Gratis y en menos de un minuto.</p>

        <form class="form" id="register-form" novalidate>
          <div class="form__message" role="status"></div>

          <div class="form__row">
            <div class="field">
              <label for="name">Tu nombre</label>
              <input type="text" id="name" name="name" autocomplete="given-name" required>
              <span class="field__error"></span>
            </div>
            <div class="field">
              <label for="partner">Nombre de tu pareja</label>
              <input type="text" id="partner" name="partner" required>
              <span class="field__error"></span>
            </div>
          </div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="tu@correo.com" required>
            <span class="field__error"></span>
          </div>

          <div class="field">
            <label for="date">Fecha de la boda (opcional)</label>
            <input type="date" id="date" name="date">
            <span class="field__error"></span>
          </div>

          <div class="form__row">
            <div class="field">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
              <span class="field__error"></span>
            </div>
            <div class="field">
              <label for="confirm">Repite la contraseña</label>
              <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
              <span class="field__error"></span>
            </div>
          </div>

          <div class="field">
            <label class="check">
              <input type="checkbox" name="terms" required>
              <span>Acepto los <a href="legal/terminos.html">términos y condiciones</a> y la <a href="legal/privacidad.html">política de privacidad</a>.</span>
            </label>
            <span class="field__error"></span>
          </div>

          <button class="btn btn--block" type="submit">Crear cuenta</button>
        </form>

        <p class="auth__alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
